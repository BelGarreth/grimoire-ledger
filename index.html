<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire Ledger – D&amp;D 3.5 sheet, gear ledger and spellbook</title>
<style>
:root{
  --bg:#14181f; --panel:#1b212a; --raise:#232b36; --line:#2f3946;
  --ink:#e8e4d9; --mute:#9aa4b2; --brass:#dfba6c; --ok:#5cc4b0; --bad:#e58583;
  --sys:#a4aef5; --on-sys:#0e1418;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"DejaVu Serif",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;font:14.5px/1.45 var(--sans);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sys);outline-offset:2px}
h1{font:600 24px/1.1 var(--serif);margin:0}
h2{font:600 18px/1.2 var(--serif);margin:0 0 10px;color:var(--brass)}
h3{font:600 14px/1.2 var(--sans);margin:14px 0 6px;color:var(--mute)}
.sub{color:var(--mute);font-size:12.5px}
.mute{color:var(--mute)} .bad{color:var(--bad)} .ok{color:var(--ok)} .brass{color:var(--brass)}
.top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.top .who{min-width:0}
.top .acts{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;align-items:center}
.wallet{display:flex;gap:14px;align-items:baseline;font-size:13px;color:var(--mute)}
.wallet b{color:var(--ok);font-family:var(--serif);font-size:16px}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:2px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brass)}
main{padding:18px 20px 60px;max-width:1280px;margin:0 auto}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--brass)}
.btn.pri{background:var(--sys);border-color:var(--sys);color:var(--on-sys);font-weight:600}
.btn.sm{padding:2px 8px;font-size:12.5px}
.btn.x:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card>h2:first-child{margin-top:0}
.g2,.g3,.g4,.g6{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g6{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.row.c{align-items:center}
input[type=text],input[type=number],select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--ink);min-width:0}
textarea{resize:vertical}
.w{width:100%} .n{width:68px;text-align:center} .n.s{width:52px} .n.l{width:92px}
input[type=checkbox]{accent-color:var(--sys);width:16px;height:16px}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12px;color:var(--mute);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.num,table.t th.num{text-align:right}
table.t tr:hover td{background:rgba(255,255,255,.02)}
.scroll{overflow-x:auto}
.tall{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.big{font:600 26px/1 var(--serif);color:var(--ink)}
.stat{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.stat small{display:block;color:var(--mute);font-size:12px}
.stat .big{display:block;margin-top:2px}
.ab{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.ab b{font-family:var(--serif);color:var(--brass);font-size:15px}
.ab .tot{font:600 24px/1.1 var(--serif)} .ab .md{color:var(--sys);font-weight:600}
.bar{height:8px;border-radius:5px;background:var(--raise);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--ok)} .bar.over>i{background:var(--bad)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mute)}
.pill.on{border-color:var(--ok);color:var(--ok)} .pill.warn{border-color:var(--bad);color:var(--bad)}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.slot{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:54px}
.slot.over{border-color:var(--bad)} .slot h4{margin:0 0 3px;font:600 12px var(--sans);color:var(--mute)}
.slot div{font-size:13.5px}
.slot .off{color:var(--mute);text-decoration:line-through}
.sub-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sub-tabs button{background:var(--raise);border:1px solid var(--line);border-radius:99px;padding:4px 14px;cursor:pointer;color:var(--mute)}
.sub-tabs button.on{border-color:var(--brass);color:var(--ink)}
.tok{width:128px;height:128px;border-radius:50%;border:2px solid var(--brass);background:var(--raise) center/cover;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;text-align:center}
.note{font-size:12.5px;color:var(--mute);margin:6px 0}
.break{font-size:12px;color:var(--mute)}
.break.off{text-decoration:line-through;opacity:.65}
table.bt td{vertical-align:top}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--raise);border:1px solid var(--brass);padding:8px 16px;border-radius:8px;z-index:99;display:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--mute)}
details>summary{cursor:pointer;color:var(--mute);margin:6px 0}
/* sheet mode */
.sheet h2{border-bottom:1px solid var(--line);padding-bottom:3px}
.sheet .hd{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.sheet .hd .tk{width:72px;height:72px;border-radius:50%;border:2px solid var(--brass);background:center/cover}
.sheet .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.sheet table.t td,.sheet table.t th{padding:2px 6px}
.sheet .abs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.sheet .ab{flex:0 0 auto;min-width:78px;padding:2px 9px;display:flex;align-items:baseline;justify-content:center;gap:6px;border-radius:6px}
.sheet .ab b{font-size:11px;letter-spacing:.05em}
.sheet .ab .tot{font-size:16px}
.sheet .ab .md{font-size:12px}
.sheet .vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:12px}
.sheet .vit .stat{padding:6px 8px}
.sheet .vit .stat .big{font-size:25px}
.sheet .prime{border-color:var(--brass)}
.sheet .sav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sheet .svt{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center}
.sheet .svt small{display:block;color:var(--mute);font-size:12.5px}
.sheet .svt .bg{display:block;font:700 40px/1.05 var(--serif);color:var(--brass)}
.sheet .svt em{display:block;font-style:normal;color:var(--mute);font-size:11.5px;min-height:1em}
.sheet table.atk{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.sheet table.atk th{font-size:12px;color:var(--mute);font-weight:500;text-align:left;padding:3px 8px;border-bottom:1px solid var(--line)}
.sheet table.atk td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.sheet table.atk td.hit{font:700 23px/1.1 var(--serif);color:var(--brass);white-space:nowrap}
.sheet table.atk td.dmg{font:600 17px/1.1 var(--serif);white-space:nowrap}
.sheet table.atk .sm{display:block;color:var(--mute);font-size:11.5px;font-family:var(--sans);font-weight:400}
.sheet .jump{display:none}
.sheet .sec{scroll-margin-top:52px}
.sheet .sk td,.sheet .sk th{white-space:nowrap}
.csgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px;margin:6px 0}
.csgrid label{font-size:13px;display:flex;gap:6px;align-items:center}
.brk{display:none}
.skcol{width:46px}
.stat.warn .big{color:var(--bad)}
@media screen{
body.phone{font-size:15px}
body.phone .top{padding:8px 10px;gap:6px 10px}
body.phone .top h1{font-size:20px}
body.phone .top .acts{flex-wrap:nowrap;overflow-x:auto;margin-left:0;width:100%;padding-bottom:3px;-webkit-overflow-scrolling:touch}
body.phone .top .acts .btn{white-space:nowrap;flex:0 0 auto;min-height:36px}
body.phone .wallet{flex-wrap:wrap;gap:4px 12px}
body.phone .tabs{padding:0 4px}
body.phone .tabs button{padding:12px 11px}
body.phone main{padding:10px 8px 70px}
body.phone .card{padding:10px;margin-bottom:10px}
body.phone input[type=text],body.phone input[type=number],body.phone select,body.phone textarea{font-size:16px;min-height:38px}
body.phone .btn{min-height:36px}
body.phone .btn.sm{min-height:32px;padding:3px 10px}
body.phone input[type=checkbox]{width:20px;height:20px}
body.phone .g2,body.phone .g3{grid-template-columns:1fr}
body.phone .g4,body.phone .g6{grid-template-columns:repeat(2,1fr)}
body.phone .hm{display:none}
body.phone .brk{display:block;font-size:11.5px;color:var(--mute);line-height:1.3}
body.phone .row{gap:8px}
body.phone .sheet .cols{grid-template-columns:1fr}
body.phone .sheet .ab{min-width:0;flex:1 1 30%;padding:2px 4px}
body.phone .sheet .vit{grid-template-columns:repeat(3,1fr);gap:6px}
body.phone .sheet .sav{grid-template-columns:repeat(2,1fr)}
body.phone .sheet .svt .bg{font-size:36px}
body.phone .sheet table.atk{font-size:14px}
body.phone .sheet table.atk .hm2{display:none}
body.phone .sheet .hd .tk{width:52px;height:52px}
body.phone .sheet .jump{display:flex;position:sticky;top:0;z-index:15;gap:6px;overflow-x:auto;padding:6px 0;margin:-4px 0 8px;background:var(--bg);border-bottom:1px solid var(--line)}
body.phone .sheet .jump button{flex:0 0 auto}
body.phone .slotgrid{grid-template-columns:1fr 1fr}
body.phone .toast{width:92%;text-align:center}
}


/* ---- print sheet ---- */
.paperwrap{overflow-x:auto;padding:4px 0 20px}
.paper{--pk:#1c1a17;--pm:#5f5a50;--pa:#7a5c14;--pl:#cfc7b4;--pf:#f6f1e3;--pbg:#fff;color:var(--pk);font:9pt/1.32 var(--sans);width:210mm;margin:0 auto}
.paper.letter{width:8.5in}
.paper.parchment{--pbg:#fbf6e8;--pf:#f1e8cf;--pl:#c9b98f}
.paper .pp-page{background:var(--pbg);padding:11mm 12mm;min-height:297mm;margin:0 auto 14px;box-shadow:0 2px 14px rgba(0,0,0,.45);-webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;flex-direction:column;gap:7pt}
.paper.letter .pp-page{min-height:11in}
.paper.compact{font-size:8.2pt}.paper.compact .pp-page{min-height:0}
.paper h1{font:700 23pt/1.05 var(--serif);margin:0;color:var(--pk)}
.paper .pp-head{display:flex;align-items:center;gap:12pt;border-bottom:2.2px solid var(--pa);padding-bottom:6pt}
.paper .pp-head>div:first-of-type{flex:1;min-width:0}
.paper .pp-tok{width:54pt;height:54pt;border-radius:50%;border:1.6px solid var(--pa);object-fit:cover}
.paper .pp-sub{color:var(--pm);font-size:9.5pt}
.paper .pp-meta{text-align:right;color:var(--pm);font-size:8pt;line-height:1.4}
.paper .pp-h{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--pa);border-bottom:1px solid var(--pa);margin:0 0 4pt;padding-bottom:2pt}
.paper .pp-sec{break-inside:avoid}
.paper .pp-abs{display:grid;grid-template-columns:repeat(6,1fr);gap:5pt}
.paper .pp-ab{border:1.2px solid var(--pk);border-radius:5pt;background:var(--pf);text-align:center;padding:3pt 2pt 4pt;position:relative}
.paper .pp-ab b{display:block;font:700 7.5pt var(--sans);letter-spacing:.1em;color:var(--pa)}
.paper .pp-ab .v{display:block;font:700 17pt/1.05 var(--serif)}
.paper .pp-ab .m{display:inline-block;margin-top:1pt;min-width:22pt;border:1.2px solid var(--pk);border-radius:99px;background:var(--pbg);font:700 9.5pt var(--sans)}
.paper .pp-ab small{display:block;color:var(--pm);font-size:6.5pt}
.paper .pp-cols{display:grid;grid-template-columns:1fr 1.18fr;gap:9pt;align-items:start}
.paper .pp-col{display:flex;flex-direction:column;gap:7pt;min-width:0}
.paper .pp-boxes{display:flex;gap:4pt}
.paper .pp-box{flex:1 1 0;min-width:0;border:1.2px solid var(--pk);border-radius:5pt;background:var(--pf);text-align:center;padding:2pt 2pt 3pt}
.paper .pp-box small{display:block;font:700 6.5pt var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--pm)}
.paper .pp-box b{display:block;font:700 15pt/1.1 var(--serif);color:var(--pk)}
.paper .pp-box i{display:block;font-style:normal;font-size:6.5pt;color:var(--pm)}
.paper .pp-box.xl b{font-size:19pt}
.paper .pp-note{font-size:7pt;color:var(--pm);margin-top:2pt}
.paper .pp-write{display:flex;align-items:flex-end;gap:4pt;font-size:8pt;margin-top:3pt}
.paper .pp-write span{flex:1;border-bottom:1px solid var(--pk);height:11pt}
.paper table{width:100%;border-collapse:collapse;font-size:8.3pt}
.paper th{font:700 6.8pt var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--pm);text-align:left;padding:1pt 3pt;border-bottom:1px solid var(--pk)}
.paper td{padding:1.6pt 3pt;border-bottom:.6px solid var(--pl)}
.paper .num{text-align:right}
.paper .pp-skills{column-count:1}
.paper .pp-sk{display:grid;grid-template-columns:8pt 1fr 18pt 20pt 24pt;gap:3pt;align-items:baseline;padding:1.1pt 0;border-bottom:.6px solid var(--pl);font-size:8.2pt}
.paper .pp-sk.hd{font:700 6.5pt var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--pm);border-bottom:1px solid var(--pk)}
.paper .pp-sk .n{min-width:0}.paper .pp-sk .a{color:var(--pm);font-size:7pt;text-transform:uppercase}.paper .pp-sk b{text-align:right;font-size:9pt}.paper .pp-sk .r{text-align:right;color:var(--pm)}
.paper .pp-list{display:flex;flex-direction:column;gap:2.5pt}
.paper .pp-li{break-inside:avoid;line-height:1.28;margin-bottom:2.5pt}.paper .pp-li small{color:var(--pm);font-size:7.2pt}
.paper .pbox{display:inline-block;width:7pt;height:7pt;border:1px solid var(--pk);border-radius:1.5pt;margin-right:1.5pt;vertical-align:-1pt;background:var(--pbg)}
.paper .pp-2{columns:2;column-gap:10pt}
.paper .pp-2>*{break-inside:avoid}
.paper .mute{color:var(--pm)}
.paper .off{color:var(--pm);font-style:italic}
.paper .pp-spl{display:grid;grid-template-columns:50pt 34pt 1fr;gap:3pt 6pt;align-items:center;font-size:8.2pt}
.paper .pp-foot{margin-top:auto;border-top:.6px solid var(--pl);padding-top:3pt;color:var(--pm);font-size:6.8pt;display:flex;justify-content:space-between}
.pr-opts label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
@media print{
 .paperwrap{overflow:visible;padding:0}
 .paper{width:auto!important;margin:0}
 .paper .pp-page{box-shadow:none;margin:0;padding:0;min-height:0;break-after:page;gap:7pt}
 .paper .pp-page:last-child{break-after:auto}
 .paper.compact .pp-page{break-after:auto;margin-bottom:8pt}
 .paper.parchment .pp-page{padding:0}
 html,body{background:var(--pbg,#fff)!important}
}
@media print{
  html,body{background:#fff!important;color:#000!important}
  .top,.tabs,.noprint,.toast{display:none!important}
  main{padding:0;max-width:none}
  .card{background:#fff;border-color:#999;break-inside:avoid}
  h2{color:#000!important;border-color:#999!important}
  .mute,.sub,.note,th{color:#444!important}
  .stat,.ab{background:#fff;border-color:#999}.ab b,.ab .md,.brass,.ok{color:#000!important}
  table.t td,table.t th{border-color:#bbb}
}
</style>
</head>
<body>
<header class="top">
  <div class="who"><h1>Grimoire Ledger</h1><div class="sub" id="hdrSub">D&amp;D 3.5 sheet, gear ledger and spellbook</div></div>
  <div class="wallet" id="wallet"></div>
  <div class="acts">
    <button class="btn" data-act="modeToggle" id="modeBtn">Sheet view</button>
    <button class="btn" data-act="phoneToggle" id="phoneBtn" title="Switch between automatic, phone and desktop layouts">Layout: auto</button>
    <button class="btn" data-act="newChar">New</button>
    <button class="btn" data-act="openFile">Open</button>
    <button class="btn" data-act="saveJSON">Save JSON</button>
    <button class="btn" data-act="saveMD">Save MD</button>
    <button class="btn" data-act="saveTracker">Tracker MD</button>
    <button class="btn" data-act="postOpen">Post</button>
    <button class="btn" data-act="print">Print</button>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" hidden accept=".json,.md,.txt,application/json">
<input type="file" id="tokIn" hidden accept="image/*">
<input type="file" id="mwIn" hidden accept=".json,.xml,.txt,.html,.htm,.csv,text/*,application/json,application/xml">
<input type="file" id="dbIn" hidden accept=".csv,.txt,text/csv">
<datalist id="dlSpells"></datalist><datalist id="dlFeats"></datalist><datalist id="dlFeatNames"></datalist><datalist id="dlClasses"></datalist>
<datalist id="dlChakra"><option>Arms</option><option>Brow</option><option>Crown</option><option>Feet</option><option>Hands</option><option>Heart</option><option>Shoulders</option><option>Soul</option><option>Throat</option><option>Waist</option><option>Wrists</option></datalist>
<script>
'use strict';
/* =========================== DATA =========================== */
const ABIL=['str','dex','con','int','wis','cha'];
const AN={str:'Strength',dex:'Dexterity',con:'Constitution',int:'Intelligence',wis:'Wisdom',cha:'Charisma'};
const SIZES={F:['Fine',8],D:['Diminutive',4],T:['Tiny',2],S:['Small',1],M:['Medium',0],L:['Large',-1],H:['Huge',-2],G:['Gargantuan',-4],C:['Colossal',-8]};
const GRAPPLE={F:-16,D:-12,T:-8,S:-4,M:0,L:4,H:8,G:12,C:16};
const BTYPES=['enhancement','inherent','resistance','deflection','natural','armor','shield','dodge','luck','insight','sacred','profane','morale','competence','circumstance','racial','alchemical','untyped'];
const STACKS=new Set(['dodge','circumstance','untyped','']);
const SK="Appraise:int;Balance:dex:a;Bluff:cha;Climb:str:a;Concentration:con;Decipher Script:int:t;Diplomacy:cha;Disable Device:int:t;Disguise:cha;Escape Artist:dex:a;Forgery:int;Gather Information:cha;Handle Animal:cha:t;Heal:wis;Hide:dex:a;Intimidate:cha;Jump:str:a;Knowledge (arcana):int:t;Knowledge (architecture and engineering):int:t;Knowledge (dungeoneering):int:t;Knowledge (geography):int:t;Knowledge (history):int:t;Knowledge (local):int:t;Knowledge (nature):int:t;Knowledge (nobility and royalty):int:t;Knowledge (religion):int:t;Knowledge (the planes):int:t;Listen:wis;Move Silently:dex:a;Open Lock:dex:t;Ride:dex;Search:int;Sense Motive:wis;Sleight of Hand:dex:ta;Spellcraft:int:t;Spot:wis;Survival:wis;Swim:str:s;Tumble:dex:ta;Use Magic Device:cha:t;Use Rope:dex;Autohypnosis:wis:t;Knowledge (psionics):int:t;Psicraft:int:t";
const SKILLS=SK.split(';').map(s=>{const [n,a,f='']=s.split(':');return{n,a,t:f.includes('t'),acp:f.includes('a')||f.includes('s'),sw:f.includes('s')}});
const SLOTS=[['head','Head'],['headband','Headband'],['eyes','Eyes'],['face','Face'],['neck','Neck'],['shoulders','Shoulders'],['chest','Chest'],['body','Body'],['armor','Armor'],['belt','Belt'],['wrists','Wrists'],['hands','Hands'],['ring','Ring'],['feet','Feet'],['shield','Shield'],['weapon','Weapon'],['','Carried']];
const SLOTCAP={ring:2,weapon:3,'':99};

function trackData(){

  return{bab,f,r,w,tl,hd,sp,names:arr.filter(x=>num(x.lv)>0).map(x=>(x.name||'Class')+' '+x.lv)}};

 const len=Math.max(A.hd.length,B.hd.length),hd=[],sp=[];
 for(let i=0;i<len;i++){hd.push(Math.max(A.hd[i]||0,B.hd[i]||0));sp.push(Math.max(A.sp[i]||0,B.sp[i]||0))}
 const m={};hd.forEach(d=>m[d]=(m[d]||0)+1);
 const hdStr=Object.keys(m).sort((x,y)=>x-y).map(d=>m[d]+'d'+d).join(' + ');

 return{A,B,g,sp,tl:Math.max(A.tl,B.tl),bab:Math.max(A.bab,B.bab),f:Math.max(A.f,B.f),r:Math.max(A.r,B.r),w:Math.max(A.w,B.w),hdStr,skill,label,mismatch:g&&A.tl!==B.tl}}
function casterFor(K){
 const def=CASTERS[K.cls];if(!K.cls||!def)return null;
 const ab=K.abil=def.abil&&K.cls!=='custom'?def.abil:K.abil;
 const use=!!K.useBuffs,score=use?O[ab+'T']:O[ab+'TP'],mod=use?O[ab+'M']:O[ab+'MP'];
 const cll=Math.max(1,Math.min(20,Math.floor(num(K.cll,lvl()))));
 K.cl=def.half?Math.max(1,Math.floor(cll/2)):cll;
 const row=def.t?def.t[cll-1]||[]:null;const rows=[];
 for(let l=0;l<=9;l++){
  const s=K.slots[l]||(K.slots[l]={max:'',used:0});
  let base=row?(row[l]==null?null:row[l]):(s.base===''||s.base==null?null:num(s.base));
  const can=l===0||score>=10+l;
  let bonus=0,extra=0;
  if(base!=null&&can){bonus=bonusSpells(mod,l);if(K.extra==='domain'&&l>=1&&base!=null)extra=1;if(K.extra==='spec')extra=1}
  const oth=num(s.oth);
  let total=base==null?null:(can?base+bonus+extra+oth:0);
  rows.push({l,base,bonus,extra,oth,can,total});
  s.max=total==null?'':total}
 return{rows,score,mod,ab,cll}}

 P.abil=def.abil;const use=!!P.useBuffs,score=use?O[def.abil+'T']:O[def.abil+'TP'],mod=use?O[def.abil+'M']:O[def.abil+'MP'];
 const cll=Math.max(1,Math.min(20,Math.floor(num(P.cll,lvl()))));
 const base=def.t[cll-1];const bonus=Math.max(0,Math.floor(mod*cll/2));const extra=num(P.extra);
 P.ml=cll;P.pp=base+bonus+extra;
 O.psiCalc={base,bonus,extra,total:P.pp,mod,score,cll,maxLevel:Math.max(0,Math.min(9,Math.floor(score-10)))}}

function meldCard(){
 const m=C.meld;const inv=m.melds.reduce((s,x)=>s+(x.bound?num(x.ess):0),0);
 const rows=m.melds.map((x,i)=>{const p='meld.melds.'+i;return`<tr><td>${I(p+'.bound',{t:'b',r:1})}</td><td>${I(p+'.name',{c:'w'})}</td><td>${I(p+'.chakra',{list:'dlChakra',c:'n l'})}</td><td>${I(p+'.ess',{t:'n',c:'s',r:1})}</td><td class="num">${x.bound?10+num(x.ess)+O[m.abil+'M']:''}</td><td>${I(p+'.fx',{c:'w'})}</td><td>${B('delRow','×',{c:'sm x',a:'meld.melds',b:i})}</td></tr>`}).join('');
 return`<div class="card"><h2>Soulmelds</h2><div class="row">${F('Meldshaper level',I('meld.ml',{t:'n',c:'s'}))}${F('Essentia pool',I('meld.essentia',{t:'n',c:'s',r:1}))}${F('DC ability',I('meld.abil',{t:'s',opts:ABOPT,r:1}))}<div class="stat"><small>Essentia invested</small><span class="big ${inv>num(m.essentia)?'bad':''}">${inv} / ${num(m.essentia)}</span></div></div>
 <div class="scroll" style="margin-top:8px"><table class="t"><thead><tr><th>Bound</th><th>Soulmeld</th><th>Chakra</th><th>Essentia</th><th class="num">DC</th><th>Effect</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="mute">No soulmelds.</td></tr>'}</tbody></table></div>
 <div style="margin-top:8px">${B('addMeld','Add soulmeld')}</div><p class="note">Save DC = 10 + essentia invested + the chosen ability modifier (Constitution by default). Check it against your class.</p></div>`}
function psiCard(){
 const p0=C.psi,def=MANIFESTERS[p0.cls],pc=O.psiCalc;
 const rows=p0.powers.map((x,i)=>{const p='psi.powers.'+i;const base=Math.max(0,2*num(x.lvl)-1);const tot=base+num(x.aug);const cap=num(p0.ml)>0&&tot>num(p0.ml);
  return`<tr><td>${I(p+'.name',{c:'w'})}</td><td>${I(p+'.disc',{c:'n l'})}</td><td>${I(p+'.lvl',{t:'n',c:'s',r:1})}</td><td class="num">${base}</td><td>${I(p+'.aug',{t:'n',c:'s',r:1,ph:0})}</td><td class="num ${cap?'bad':''}" title="${cap?'Exceeds manifester level':''}">${tot}</td><td class="num">${10+num(x.lvl)+O[p0.abil+'M']}</td><td>${B('manifest','Manifest',{c:'sm',a:i,d:tot>num(p0.cur)})}</td><td>${B('delRow','×',{c:'sm x',a:'psi.powers',b:i})}</td></tr>`}).join('');
 const clsOpts=[['','Manual (enter power points)'],...Object.entries(MANIFESTERS).map(([k,v])=>[k,v.n])];
 const top=pc?`<div class="row">${F('Class',I('psi.cls',{t:'s',opts:clsOpts,r:1}))}${F('Class level',I('psi.cll',{t:'n',c:'s',r:1,ph:lvl()}))}${F('Other power points',I('psi.extra',{t:'n',c:'l'}))}
 <div class="stat"><small>Manifester level</small><span class="big">${pc.cll}</span></div><div class="stat"><small>${AN[def.abil]} used</small><span class="big">${pc.score}<small>${sg(pc.mod)}</small></span></div></div>
 <label class="note" style="display:block;margin:8px 0"><input type="checkbox" data-b="psi.useBuffs" data-t="b" data-r${p0.useBuffs?' checked':''}> count temporary buffs toward bonus power points</label>
 <div class="g4"><div class="stat"><small>Base (class table)</small><span class="big" data-ps="base"></span></div><div class="stat"><small>Bonus (ability)</small><span class="big" data-ps="bonus"></span></div><div class="stat"><small>Other</small><span class="big" data-ps="extra"></span></div><div class="stat"><small>Power points per day</small><span class="big" data-ps="total"></span></div></div>
 <div class="row" style="margin-top:8px">${F('Current',I('psi.cur',{t:'n',c:'l',r:1}))}${F('Manifesting ability',`<span>${AN[def.abil]}</span>`)}${B('psiRest','Rest: restore all',{c:'sm'})}</div>
 <p class="note">Bonus power points = key ability modifier × manifester level ÷ 2, rounded down (none for a negative modifier). Use "Other" for feats, race, items and crystals such as a cognizance crystal. Your key ability must be at least 10 + the power's level to manifest it.</p>`
 :`<div class="row">${F('Class',I('psi.cls',{t:'s',opts:clsOpts,r:1}))}${F('Manifester level',I('psi.ml',{t:'n',c:'s',r:1}))}${F('Power points',I('psi.pp',{t:'n',c:'l',r:1}))}${F('Current',I('psi.cur',{t:'n',c:'l',r:1}))}${F('Manifesting ability',I('psi.abil',{t:'s',opts:ABOPT,r:1}))}${B('psiRest','Rest: restore all',{c:'sm'})}</div>
 <p class="note">Choose a class to calculate power points per day from the class table and your ability score.</p>`;
 return`<div class="card"><h2>Psionic powers</h2>${top}
 <div class="scroll" style="margin-top:8px"><table class="t"><thead><tr><th>Power</th><th>Discipline</th><th>Lvl</th><th class="num">Base PP</th><th>Augment PP</th><th class="num">Total</th><th class="num">DC</th><th></th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="mute">No powers.</td></tr>'}</tbody></table></div>
 <div style="margin-top:8px">${B('addPower','Add power')}</div><p class="note">Base cost is 2 × level − 1 power points. The total spent on one power, augmentation included, cannot exceed your manifester level (flagged in red).</p></div>`}

 const L=O.led;const abs=ABIL.map(a=>`<div class="ab" title="${AN[a]}"><b>${AN[a].slice(0,3).toUpperCase()}</b><span class="tot">${O[a+'T']}</span><span class="md">${sg(O[a+'M'])}</span></div>`).join('');
 const skRow=(nm,key,ab,r,m)=>{const ch=chipText(O['skp:'+nm]);return`<tr><td>${O['cs:'+key]?'● ':''}${esc(nm)}${ch?`<span class="note" style="display:block;margin:0">${ch}</span>`:''}</td><td class="mute">${ab}</td><td class="num">${num(r)||''}</td><td class="num">${sg(O['ska:'+key])}</td><td class="num hm">${num(m)?sg(num(m)):''}</td><td class="num hm">${O['skacp:'+key]?O['skacp:'+key]:''}</td><td class="num">${O['skt:'+key+':bon']||''}</td><td class="num"><b>${sg(O['sk:'+key])}</b></td></tr>`};

  return`<tr><td><b>${esc(a.name||(a.gear&&(C.items.find(x=>x.id===a.gear)||{}).name)||'Attack')}</b>${ch?`<span class="sm">${ch}</span>`:''}</td><td class="hit">${iter(O['at:'+i+':a'])}</td><td class="dmg">${esc(a.dmg||'')}${dd?sg(dd):''}${dc?`<span class="sm">${dc}</span>`:''}</td><td>${esc(a.crit||'')}</td><td class="hm2">${esc(a.range||'')}</td></tr>`}).join('');
 const slots=SLOTS.map(([k,l])=>{const its=C.items.filter(i=>(i.slot||'')===k&&(k!==''||itemIsMagic(i)));return its.length?`<tr><td class="mute">${l}</td><td>${its.map(i=>`<span class="${i.worn===false?'mute':''}">${esc(i.name)}${num(i.qty,1)>1?' ×'+i.qty:''}</span>`).join(', ')}</td></tr>`:''}).join('');
 const carried=C.items.filter(i=>!(i.slot)&&!itemIsMagic(i)).map(i=>esc(i.name)+(num(i.qty,1)>1?' ×'+i.qty:'')).join(', ');
 const buffs=C.buffs.filter(buffActive).map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.fx||'')}</td><td class="num">${b.rounds!==''?b.rounds+' rd':esc(b.dur||'')}</td></tr>`).join('');
 const books=C.books.map(b=>{const r=bookCalc(b);const sp=b.spells.slice().sort((x,y)=>num(x.lvl)-num(y.lvl));let lv=-1,out='';sp.forEach(s=>{if(num(s.lvl)!==lv){lv=num(s.lvl);out+=`<div class="mute" style="margin-top:4px">Level ${lv}</div>`}out+=`<div>${s.st==='ins'?'':'<span class="mute">(planned)</span> '}${esc(s.name)}${num(s.prep)?' ×'+s.prep:''}</div>`});
  return`<h3>${esc(b.name||'Spellbook')} <span class="mute">(${r.pages}/${r.cap} pages)</span></h3>${out||'<div class="mute">empty</div>'}`}).join('');
 const slL=(K,dc)=>Object.keys(K.slots).filter(l=>K.slots[l].max!==''&&K.slots[l].max!=null).map(l=>`L${l}: ${num(K.slots[l].max)-num(K.slots[l].used)}/${K.slots[l].max} (DC ${dc+num(l)})`).join(' · ');
 const sl=[slL(C.caster,O.spellDC),C.caster2.on?slL(C.caster2,O.spellDC2):''].filter(Boolean).join('  |  ');
 const melds=C.meld.melds.filter(m=>m.name).map(m=>`<tr><td>${m.bound?'● ':''}${esc(m.name)}</td><td>${esc(m.chakra||'')}</td><td class="num">${m.ess||0}</td><td>${esc(m.fx||'')}</td></tr>`).join('');
 const pw=C.psi.powers.filter(p=>p.name).map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${p.lvl}</td><td class="num">${Math.max(0,2*num(p.lvl)-1)}${num(p.aug)?'+'+p.aug:''} pp</td></tr>`).join('');
 const mn=C.tob.mans.filter(m=>m.name).map(m=>`<tr><td>${m.ready?'● ':''}${esc(m.name)}</td><td>${esc(m.type)}</td><td class="num">${m.lvl}</td><td>${m.spent?'expended':m.active?'active':''}</td></tr>`).join('');
 const svs=['fort','ref','will'].map(k=>{const ch=chipText(O['svp:'+k]);return`<div class="svt"><small>${{fort:'Fortitude',ref:'Reflex',will:'Will'}[k]}</small><span class="bg">${sg(O[k])}</span><em>${ch||'&nbsp;'}</em></div>`}).join('');
 const jumps=[['sh-prime','Saves and attacks'],['sh-skills','Skills'],C.feats.length||C.cfeat.length?['sh-feats','Feats'] :null,(books||sl)?['sh-spells','Spells']:null,['sh-gear','Gear']].filter(Boolean);
 const sp=O.sktot||O.sksp?`<span class="note" style="float:right;margin:0">points ${O.sksp} of ${O.sktot}${O.skleft?` · <span class="${O.skleft<0?'bad':'brass'}">${O.skleft>0?O.skleft+' left':-O.skleft+' over'}</span>`:''}</span>`:'';
 const defs=[C.sr?`<span>SR</span><span>${esc(C.sr)}</span>`:'',C.dr?`<span>DR</span><span>${esc(C.dr)}</span>`:'',C.res?`<span>Resist</span><span>${esc(C.res)}</span>`:'',O.acp?`<span>Armor</span><span>check penalty -${O.acp}, ASF ${O.asf}%</span>`:'',num(C.hp.nl)?`<span>Nonlethal</span><span>${C.hp.nl}</span>`:''].filter(Boolean).join('');
 return`<div class="sheet"><div class="hd">${C.token?`<div class="tk" style="background-image:url(${C.token})"></div>`:''}<div style="flex:1"><h1>${esc(C.name)||'Unnamed character'}</h1><div class="sub">${[C.race,C.classes,'level '+C.level,C.align,C.deity,SIZES[C.size][0]].filter(Boolean).map(esc).join(' · ')}</div></div></div>
 <div class="jump">${jumps.map(([id,l])=>`<button class="btn sm" data-act="jump" data-a="${id}">${l}</button>`).join('')}</div>
 <div class="abs">${abs}</div>
 <div class="vit"><div class="stat"><small>HP</small><span class="big">${C.hp.cur||0}<span class="mute" style="font-size:14px"> / ${O.hpmax}</span></span></div><div class="stat"><small>AC</small><span class="big">${O.ac}</span></div><div class="stat"><small>Touch</small><span class="big">${O.touch}</span></div><div class="stat"><small>Flat-footed</small><span class="big">${O.ff}</span></div><div class="stat"><small>Initiative</small><span class="big">${sg(O.init)}</span></div><div class="stat"><small>Speed</small><span class="big">${O.speed}<span class="mute" style="font-size:14px"> ft</span></span></div></div>
 <div class="card prime sec" id="sh-prime"><h2>Saves and attacks</h2><div class="sav">${svs}<div class="svt"><small>Base attack</small><span class="bg">${O.babStr.split('/')[0]}</span><em>${O.babStr.includes('/')?O.babStr:'grapple '+sg(O.grapple)}</em></div></div>
 ${at?`<table class="atk"><thead><tr><th>Attack</th><th>To hit</th><th>Damage</th><th>Crit</th><th class="hm2">Range</th></tr></thead><tbody>${at}</tbody></table>`:'<p class="note">No attacks yet. Add them on the Combat tab.</p>'}</div>
 <div class="cols"><div>

 ${buffs?`<div class="card"><h2>Active buffs</h2><table class="t"><tbody>${buffs}</tbody></table></div>`:''}
 <div class="card sec" id="sh-gear"><h2>Gear</h2><table class="t"><tbody>${slots}</tbody></table>${carried?`<p class="note">Carried: ${carried}</p>`:''}<p class="note">Spent ${money(L.spent)} of ${money(L.budget)} · kit value ${money(L.value)}</p></div></div>
 <div><div class="card sec" id="sh-skills"><h2>Skills${sp}</h2><div class="scroll"><table class="t sk"><thead><tr><th>Skill</th><th>Abil</th><th class="num">Rk</th><th class="num">Mod</th><th class="num hm">Misc</th><th class="num hm">ACP</th><th class="num">Bon</th><th class="num">Total</th></tr></thead><tbody>${sk||'<tr><td class="mute">No ranks entered.</td></tr>'}</tbody></table></div><p class="note">● class skill. Mod is the ability modifier, Bon the typed bonuses from gear, feats and buffs.</p></div>
 ${C.feats.length?`<div class="card sec" id="sh-feats"><h2>Feats</h2><div>${C.feats.map(f=>`<span class="${f.on===false?'mute':''}">${esc(f.name)}</span>`).join(', ')}</div></div>`:''}

/* =========================== EXPORT / IMPORT =========================== */
const slug=()=>(C.name||'character').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'character';
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},200)}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function mdTable(h,rows){return'| '+h.join(' | ')+' |\n|'+h.map(()=>'---').join('|')+'|\n'+rows.map(r=>'| '+r.map(x=>String(x==null?'':x).replace(/\|/g,'/')).join(' | ')+' |').join('\n')+'\n'}
function toMD(){
 const L=O.led;let m=`---\nname: ${C.name}\nclass: ${C.classes}\nlevel: ${C.level}\nrace: ${C.race}\ntags: [dnd35, character-sheet]\n---\n\n# ${C.name||'Unnamed character'}\n\n${[C.race,C.classes,'level '+C.level,C.align].filter(Boolean).join(' · ')}\n\n`;
 m+=`## Abilities\n\n`+mdTable(ABIL.map(a=>AN[a].slice(0,3)),[ABIL.map(a=>`${O[a+'T']} (${sg(O[a+'M'])})`)]);

/* ---- Myth-Weavers import (fuzzy) ---- */
function mwImport(src){
 let obj=null;try{obj=JSON.parse(src)}catch(e){obj={};src.split(/\n/).forEach(l=>{const m=l.match(/^\s*([^:=]+?)\s*[:=]\s*(.*)$/);if(m)obj[m[1]]=m[2]})}
 const flat={};(function walk(o,p){if(o&&typeof o==='object'){for(const k in o)walk(o[k],p?p+'_'+k:k)}else flat[p]=o})(obj,'');
 const norm=k=>k.toLowerCase().replace(/[^a-z0-9]/g,'');
 const used=new Set();const nc=num;
 const take=(re,fn)=>{for(const k in flat){if(used.has(k))continue;if(re.test(norm(k))&&flat[k]!==''&&flat[k]!=null){fn(flat[k],k);used.add(k);return true}}return false};
 take(/^(character)?name$/,v=>C.name=String(v));take(/^race$/,v=>C.race=String(v));take(/^(class|classes|classlevel|classandlevel)$/,v=>C.classes=String(v));
 take(/^(total)?level$|^characterlevel$/,v=>C.level=nc(v,1));take(/^alignment$/,v=>C.align=String(v));take(/^(deity|god)$/,v=>C.deity=String(v));take(/^age$/,v=>C.age=String(v));take(/^(gender|sex)$/,v=>C.gender=String(v));
 ABIL.forEach(a=>{const n=AN[a].toLowerCase();take(new RegExp('^('+a+'|'+n+'|'+a+'score|'+n+'score|'+a+'base|'+a+'total)$'),v=>C.abil[a]=nc(v,10))});
 take(/^(hp|hitpoints|maxhp|hptotal|totalhp)$/,v=>C.hp.max=nc(v));take(/^(speed|move|movement|basespeed)$/,v=>C.speed=nc(v,30));take(/^(bab|baseattack|baseattackbonus)$/,v=>C.bab=nc(v));
 take(/^(init|initiative|initmisc)$/,v=>C.init.m=0);
 [['fort','fortitude'],['ref','reflex'],['will','will']].forEach(([k,n])=>take(new RegExp('^('+k+'|'+n+'|'+k+'base|'+n+'base|'+k+'save|'+n+'save)$'),v=>C.saves[k].b=nc(v)));
 take(/^(sr|spellresistance)$/,v=>C.sr=String(v));take(/^(dr|damagereduction)$/,v=>C.dr=String(v));
 SKILLS.forEach(s=>{const n=norm(s.n);for(const k in flat){if(used.has(k))continue;const nk=norm(k);if(nk===n+'ranks'||nk==='skill'+n+'ranks'||nk===n+'rank'||nk==='ranks'+n||nk==='skills'+n+'ranks'){C.skills[s.n]=C.skills[s.n]||{};C.skills[s.n].r=nc(flat[k]);used.add(k)}else if(nk===n+'misc'||nk==='skill'+n+'misc'||nk==='skills'+n+'misc'){C.skills[s.n]=C.skills[s.n]||{};C.skills[s.n].m=nc(flat[k]);used.add(k)}}});
 const rest=Object.keys(flat).filter(k=>!used.has(k)&&flat[k]!==''&&flat[k]!=null&&flat[k]!==0&&flat[k]!=='0'&&String(flat[k]).length<400).map(k=>k+': '+flat[k]);
 if(rest.length)C.unmapped=(C.unmapped?C.unmapped+'\n':'')+'Imported from Myth-Weavers:\n'+rest.join('\n');
 const n=used.size;render();toast('Imported '+n+' fields, '+rest.length+' kept as notes')}

/* ---- CSV ---- */
function csvEsc(s){s=String(s==null?'':s);return/[",\r\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function toCSV(cols,recs){return'\ufeff'+[cols,...recs.map(r=>cols.map(c=>r[c]))].map(r=>r.map(csvEsc).join(',')).join('\r\n')+'\r\n'}
function parseCSV(text){
 text=text.replace(/^\ufeff/,'');const first=text.split(/\r?\n/)[0]||'';
 const cnt=ch=>{let n=0,q=false;for(const c of first){if(c==='"')q=!q;else if(!q&&c===ch)n++}return n};
 let delim=',',best=cnt(',');[';','\t'].forEach(d=>{const n=cnt(d);if(n>best){best=n;delim=d}});
 const rows=[];let row=[],f='',inq=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(inq){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}
  else if(c==='"'&&f==='')inq=true;
  else if(c===delim){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
  else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}
 return{rows:rows.filter(r=>!(r.length===1&&String(r[0]).trim()==='')),delim}}
const normHead=h=>String(h||'').replace(/^\ufeff/,'').trim().toLowerCase().replace(/[\s\-]+/g,'_');

function applyRecords(tid,recs){const T=DBT[tid];const errs=[];let ok=0;const good=[];
 recs.forEach(({o,line})=>{try{T.put(o);ok++;good.push(o)}catch(e){errs.push(`Line ${line}: ${e}`)}});return{ok,errs,good}}
function importCSV(text,tid,mode){
 const {rows,delim}=parseCSV(text);DBDELIM=delim;
 if(rows.length<2)throw'The file needs a header row and at least one data row.';
 const head=rows[0].map(normHead);let note='';
 if(tid==='auto'){let best=null,bs=0;DBORDER.forEach(t=>{const T=DBT[t];const hs=new Set(head.map(h=>T.alias[h]||h));const s=T.cols.filter(c=>hs.has(c)).length-(hs.has('name')?0:99);if(s>bs){bs=s;best=t}});
  if(!best||bs<2)throw'Could not tell which library this file belongs to from its column headings. Choose the library in the list and import again.';tid=best;note=`Detected: ${DBT[tid].label}. `}
 const T=DBT[tid];const map=head.map(h=>T.alias[h]||h);
 const missing=T.cols.filter(c=>['name'].includes(c)&&!map.includes(c));if(missing.length)throw`The "${T.label}" library needs a "name" column. Found: ${head.join(', ')}.`;
 const recs=[];rows.slice(1).forEach((r,i)=>{if(r.every(x=>String(x).trim()===''))return;const o={};T.cols.forEach(c=>o[c]='');map.forEach((c,j)=>{if(T.cols.includes(c))o[c]=String(r[j]==null?'':r[j]).trim()});recs.push({o,line:i+2})});
 if(!recs.length)throw'No data rows found.';
 let snap=null;if(mode==='replace'){snap=T.rows();T.clear()}
 const res=applyRecords(tid,recs);
 if(mode==='replace'&&res.ok===0){T.clear();snap.forEach(o=>{try{T.put(o)}catch(e){}});T.after();throw'No valid rows were found, so nothing was replaced. '+(res.errs[0]||'')}
 T.after();
 const cur=DBX[tid]&&!DBX[tid].replace?DBX[tid]:{replace:mode==='replace',rows:[]};
 if(mode==='replace')DBX[tid]={replace:true,rows:res.good};
 else{const idx=new Map(cur.rows.map((o,i)=>[T.key(o),i]));res.good.forEach(o=>{const k=T.key(o);if(idx.has(k))cur.rows[idx.get(k)]=o;else{idx.set(k,cur.rows.length);cur.rows.push(o)}});
  if(DBX[tid]&&DBX[tid].replace){const r=DBX[tid];const i2=new Map(r.rows.map((o,i)=>[T.key(o),i]));res.good.forEach(o=>{const k=T.key(o);if(i2.has(k))r.rows[i2.get(k)]=o;else r.rows.push(o)})}else DBX[tid]=cur}
 saveDB();
 return{tid,label:T.label,ok:res.ok,errs:res.errs,note,mode}}
function applyDBX(){Object.keys(DBX).forEach(tid=>{const T=DBT[tid],x=DBX[tid];if(!T||!x)return;if(x.replace)T.clear();(x.rows||[]).forEach(o=>{try{T.put(o)}catch(e){}});T.after()})}
function dbInit(){DBORDER.forEach(t=>BUILTIN[t]=DBT[t].rows());applyDBX();refreshLists()}
function dbReset(tid){const T=DBT[tid];delete DBX[tid];saveDB();T.clear();BUILTIN[tid].forEach(o=>{try{T.put(o)}catch(e){}});T.after()}
function dbExport(tid){download('grimoire-'+tid+'.csv',toCSV(DBT[tid].cols,DBT[tid].rows()),'text/csv;charset=utf-8')}
function dbTemplate(tid){download('grimoire-'+tid+'-template.csv',toCSV(DBT[tid].cols,[DBT[tid].example]),'text/csv;charset=utf-8')}
function decodeBuf(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}}

 return`<div class="card"><h2>Database</h2><p class="note">These are the libraries behind the feat, class, class feature, shop, spell and base item pickers. Export any of them as CSV, edit the file in a spreadsheet, and import it back, or import libraries from another source. Imports are kept in this browser and used the next time you open the page; the character file itself does not carry them.</p>

 <div class="row" style="margin-top:10px">${B('dbExportAll','Export all libraries',{c:'sm'})}<span class="note">Downloads one CSV per library.</span></div></div>
 <div class="card"><h2>Import</h2><div class="row">
 ${F('Library',I('$dbTable',{t:'s',opts:[['auto','Detect from the file'],...DBORDER.map(t=>[t,DBT[t].label])],r:0}))}
 ${F('If an entry already exists',I('$dbMode',{t:'s',opts:[['merge','Add new and update matching names'],['replace','Replace the whole library']]}))}
 ${B('dbFile','Choose CSV file',{c:'pri'})}</div>
 <textarea id="dbPaste" rows="4" class="w" style="margin-top:8px" placeholder="Or paste CSV text here, including the heading row"></textarea>
 <div style="margin-top:6px">${B('dbPasteGo','Import pasted text',{c:'sm'})}</div>
 ${rep?`<div class="card" style="margin:10px 0 0;background:var(--raise)"><b class="${rep.errs&&rep.errs.length&&!rep.ok?'bad':'ok'}">${esc(rep.title)}</b>${rep.errs&&rep.errs.length?`<div class="note bad" style="margin-top:6px">${rep.errs.slice(0,15).map(esc).join('<br>')}${rep.errs.length>15?`<br>…and ${rep.errs.length-15} more`:''}</div>`:''}</div>`:''}
 <p class="note">Excel files saved with semicolons, tabs or Windows-1252 accents are handled. Column headings are matched by name, so order does not matter, and common alternatives are accepted (for example "prereq" for prerequisites). Rows with a problem are skipped and listed above, and the rest are imported. In replace mode, nothing is changed if no row is valid.</p></div>
 <div class="card"><h2>Column guide</h2>

const SKCANON=(()=>{const m={};SKILLS.forEach(s=>m[NK(s.n)]=s.n);
 Object.entries({sleight:'Sleight of Hand',umd:'Use Magic Device',gatherinfo:'Gather Information',userope:'Use Rope',useropes:'Use Rope',sensemotive:'Sense Motive',hide:'Hide',appraise:'Appraise'}).forEach(([k,v])=>m[k]=v);return m})();

function canonSkill(raw){const t=NK(raw);if(!t)return null;if(SKCANON[t])return SKCANON[t];
 if(/^know/.test(t)){const subj=t.replace(/^knowledge|^know/,'').replace(/^the/,'');for(const p in KSUB)if(subj.startsWith(p))return'Knowledge ('+KSUB[p]+')'}return null}
const SKFIELDS=[['classskill','cc'],['miscmod','misc'],['modmisc','misc'],['totalmod','total'],['skillmod','total'],['modifier','total'],['ranks','ranks'],['rank','ranks'],['misc','misc'],['total','total'],['bonus','total'],['mod','total'],['cs','cc'],['cc','cc'],['abilitymod','ignore'],['keyability','ignore'],['abmod','ignore'],['acp','ignore'],['key','ignore'],['ab','ignore']];
function skillKey(nk){nk=nk.replace(/^(skills|skill|sk)/,'');if(!nk)return null;const direct=canonSkill(nk);if(direct)return{name:direct,f:'total'};
 for(const [a,f] of SKFIELDS){if(nk.endsWith(a)&&nk.length>a.length){const n=canonSkill(nk.slice(0,-a.length));if(n)return{name:n,f}}
  if(nk.startsWith(a)&&nk.length>a.length){const n=canonSkill(nk.slice(a.length));if(n)return{name:n,f}}}return null}

/* ---- readers: every format ends up as a list of {key,tokens,value} ---- */
function flattenJSON(o,path,out){if(typeof o==='string'&&/^\s*[\[{]/.test(o)&&o.length>2){try{return flattenJSON(JSON.parse(o),path,out)}catch(e){}}
 if(o!==null&&typeof o==='object'){if(Array.isArray(o))o.forEach((v,i)=>flattenJSON(v,[...path,String(i)],out));else Object.keys(o).forEach(k=>flattenJSON(o[k],[...path,k],out))}
 else out.push({tokens:path,key:path.join('_'),value:o==null?'':String(o)});return out}
function xmlPairs(txt){
 const clean=txt.replace(/&(?!(amp|lt|gt|quot|apos|#\d+|#x[0-9a-f]+);)/gi,'&amp;').replace(/<!DOCTYPE[^>]*>/i,'');
 const doc=new DOMParser().parseFromString(clean,'text/xml');if(doc.querySelector('parsererror'))throw'The XML could not be read.';

 pair('b',x=>`<b>${x}</b>`);pair('i',x=>`<i>${x}</i>`);pair('u',x=>`<u>${x}</u>`);pair('s',x=>`<s>${x}</s>`);
 pair('quote',x=>`<blockquote>${x.replace(/^\n|\n$/g,'')}</blockquote>`);pair('spoiler',x=>`<span class="pbspoil">${x}</span>`);pair('center',x=>`<div style="text-align:center">${x}</div>`);
 pair('color',(x,c)=>/^(#[0-9a-f]{3,8}|[a-z]{3,20})$/i.test(c||'')?`<span style="color:${c}">${x}</span>`:x);
 pair('size',(x,z)=>/^\d{1,2}$/.test(z||'')?`<span style="font-size:${Math.min(40,Math.max(8,+z))}px">${x}</span>`:x);
 h=h.replace(/\[url=(https?:\/\/[^\]\s"]+)\]([\s\S]*?)\[\/url\]/gi,'<a href="$1" target="_blank" rel="noopener">$2</a>').replace(/\[url\](https?:\/\/[^\[\s"]+)\[\/url\]/gi,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\[img\](https?:\/\/[^\[\s"]+)\[\/img\]/gi,'<img src="$1" style="max-width:100%">');
 return h.replace(/\n/g,'<br>')}
const PB_CSS=`.pbmask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center}
.pbm{width:min(1040px,96vw);height:86vh;background:var(--panel);border:1px solid var(--brass);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.pbh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.pbh h2{margin:0 8px 0 0}.pbh .sp{flex:1}
.pbb{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.pbl{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.pbt{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.pbt .btn{min-width:30px;padding:3px 8px}
.pbsw{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);cursor:pointer;padding:0}
.pbt input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--line);background:none}
#pbTa{flex:1;resize:none;border:0;border-radius:0;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px;background:var(--bg);min-height:0}
#pbPick{display:none;max-height:190px;overflow:auto;border-top:1px solid var(--brass);background:var(--raise)}
.pbg{font-size:11px;color:var(--brass);padding:4px 10px 0}
.pbi{padding:4px 10px;cursor:pointer}.pbi.on{background:var(--sys);color:var(--on-sys)}
.pbr{padding:12px 14px;overflow:auto;min-height:0;line-height:1.5}
.pbroll{background:rgba(164,174,245,.18);border:1px solid var(--sys);border-radius:10px;padding:0 7px;font-size:.92em;white-space:nowrap}
.pbspoil{background:var(--ink);color:var(--ink);border-radius:3px}.pbspoil:hover{background:transparent;color:inherit}
.pbr blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--brass);background:var(--raise)}
.pbgear{display:none;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--raise)}
.pbgear label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}.pbgear input{width:100%}
body.phone .pbm{width:100vw;height:100dvh;border-radius:0}body.phone .pbb{grid-template-columns:1fr;grid-template-rows:1.2fr .8fr}body.phone .pbl{border-right:0;border-bottom:1px solid var(--line)}
@media(max-width:700px){.pbm{width:100vw;height:100dvh;border-radius:0}.pbb{grid-template-columns:1fr;grid-template-rows:1.2fr .8fr}.pbl{border-right:0;border-bottom:1px solid var(--line)}}`;
function pbOpen(){
 compute();if(document.getElementById('pbMask'))return;
 const st=document.createElement('style');st.id='pbCss';if(!document.getElementById('pbCss')){st.textContent=PB_CSS;document.head.appendChild(st)}
 const m=document.createElement('div');m.className='pbmask';m.id='pbMask';
 const SW=['#c0392b','#d35400','#d4ac0d','#1e8449','#2980b9','#6c3483','#7f8c8d','#000000'];
 m.innerHTML=`<div class="pbm" role="dialog" aria-label="Post composer"><div class="pbh"><h2>Post</h2>
 <select id="pbTpl" title="Insert a template"></select><button class="btn sm" id="pbSaveTpl">Save as template</button><select id="pbDelTpl" title="Delete a saved template"></select>
 <label class="note" style="margin:0">Round <input type="text" id="pbRound" class="n s" value="${esc(PB.round)}"></label><span class="sp"></span>
 <button class="btn sm" id="pbCopyBB">Copy BBCode</button><button class="btn sm" id="pbCopyMD">Copy Discord</button><button class="btn sm" id="pbHook" title="Send to the Discord webhook in settings">Post</button>
 <button class="btn sm" id="pbGear" title="Roll syntax and webhook">⚙</button><button class="btn sm x" id="pbClose" title="Close">×</button></div>
 <div class="pbgear" id="pbGearP"><label>Forum roll tag ({d} is the dice)<input type="text" id="pbBB" value="${esc(PBS.rollBB)}"></label><label>Discord roll command<input type="text" id="pbMD" value="${esc(PBS.rollMD)}"></label><label>Sheet link used by /sheet<input type="text" id="pbUrl" value="${esc(PBS.sheetUrl)}" placeholder="https://"></label><label>Discord webhook URL (stays in this browser, never saved in the character file)<input type="text" id="pbWeb" value="${esc(PBS.webhook)}" placeholder="https://discord.com/api/webhooks/…"></label></div>
 <div class="pbb"><div class="pbl"><div class="pbt">${[['b','B'],['i','I'],['u','U'],['s','S'],['quote','Quote'],['spoiler','Spoiler'],['center','Center']].map(([t,l])=>`<button class="btn sm" data-w="${t}" title="[${t}]">${l}</button>`).join('')}<span style="width:6px"></span>${SW.map(c=>`<button class="pbsw" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}<input type="color" id="pbCol" value="#c0392b" title="Pick a colour"><span style="width:6px"></span><button class="btn sm" id="pbAt" title="Insert a roll from the sheet">@ roll</button><button class="btn sm" id="pbSl" title="Quick inserts">/ insert</button></div>
 <textarea id="pbTa" spellcheck="true" placeholder="Write your post. Type @ for rolls from your sheet, / for quick inserts."></textarea><div id="pbPick"></div></div><div class="pbr" id="pbPrev"></div></div></div>`;
 document.body.appendChild(m);
 const ta=m.querySelector('#pbTa'),prev=m.querySelector('#pbPrev'),pick=m.querySelector('#pbPick');ta.value=PB.text;
 const sync=()=>{PB.text=ta.value;try{localStorage.setItem('grimoire-post-draft',PB.text)}catch(e){}prev.innerHTML=pbToHTML(ta.value)||'<span class="mute">The preview appears here.</span>'};
 const tplSel=m.querySelector('#pbTpl');
 const delSel=m.querySelector('#pbDelTpl');
 const fillTpl=()=>{const sv=C.postTpl||[];tplSel.innerHTML='<option value="">Template…</option>'+PB_TPL.map((t,i)=>`<option value="b${i}">${esc(t.name)}</option>`).join('')+sv.map((t,i)=>`<option value="s${i}">${esc(t.name)} (saved)</option>`).join('');delSel.innerHTML='<option value="">Delete saved…</option>'+sv.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('');delSel.style.display=sv.length?'':'none'};fillTpl();
 delSel.addEventListener('change',()=>{const i=delSel.value;delSel.value='';if(i==='')return;const t=(C.postTpl||[])[+i];if(!t||!confirm('Delete saved template "'+t.name+'"?'))return;C.postTpl.splice(+i,1);autosave();fillTpl();toast('Deleted template "'+t.name+'"')});
 const put=(text,sel)=>{const p=PB.pick;const s=p?p.start:ta.selectionStart,e=ta.selectionStart;const v=ta.value;ta.value=v.slice(0,s)+text+v.slice(e);let a=s+text.length,b=a;if(sel){const k=text.indexOf(sel);if(k>=0){a=s+k;b=a+sel.length}}ta.focus();ta.setSelectionRange(a,b);closePick();sync()};
 const wrap=(o,c)=>{const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;ta.value=v.slice(0,s)+o+v.slice(s,e)+c+v.slice(e);if(s!==e)ta.setSelectionRange(s+o.length,e+o.length);else ta.setSelectionRange(s+o.length,s+o.length);ta.focus();sync()};
 function closePick(){PB.pick=null;pick.style.display='none'}
 function drawPick(){const p=PB.pick;if(!p)return;const list=p.sub||p.items;if(!list.length){closePick();return}p.idx=Math.max(0,Math.min(p.idx,list.length-1));let last='',h='';
  list.forEach((it,i)=>{if(!p.sub&&it.g!==last){last=it.g;h+=`<div class="pbg">${esc(it.g)}</div>`}h+=`<div class="pbi${i===p.idx?' on':''}" data-i="${i}">${esc(it.label)}${it.sub?' ›':''}</div>`});
  pick.innerHTML=h;pick.style.display='block';const on=pick.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'})}
 function openPick(kind,q,start){const items=pbItems(kind,q);if(!items.length){closePick();return}PB.pick={kind,q,start,items,idx:0,sub:null};drawPick()}
 function trigger(){const c=ta.selectionStart,b=ta.value.slice(0,c);let mm=b.match(/(^|\s)@([^\s@]*)$/);if(mm){openPick('@',mm[2],c-mm[2].length-1);return}
  mm=b.match(/(^|\s)\/([a-z]*)$/i);if(mm){openPick('/',mm[2],c-mm[2].length-1);return}closePick()}
 function accept(i){const p=PB.pick;if(!p)return;const list=p.sub||p.items;const it=list[i==null?p.idx:i];if(!it)return;if(it.sub){p.sub=it.sub;p.idx=0;drawPick();return}put(it.text,it.sel)}
 ta.addEventListener('input',()=>{sync();trigger()});
 ta.addEventListener('click',trigger);
 ta.addEventListener('keydown',e=>{const p=PB.pick;
  if(p){const list=p.sub||p.items;
   if(e.key==='ArrowDown'){e.preventDefault();p.idx=(p.idx+1)%list.length;drawPick();return}
   if(e.key==='ArrowUp'){e.preventDefault();p.idx=(p.idx-1+list.length)%list.length;drawPick();return}
   if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();accept();return}
   if(e.key==='ArrowLeft'&&p.sub){e.preventDefault();p.sub=null;p.idx=0;drawPick();return}
   if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePick();return}}
  if((e.ctrlKey||e.metaKey)&&['b','i','u'].includes(e.key.toLowerCase())){e.preventDefault();const t=e.key.toLowerCase();wrap('['+t+']','[/'+t+']')}});
 ta.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)&&!(PB.pick&&PB.pick.sub))trigger()});
 pick.addEventListener('mousedown',e=>{e.preventDefault();const it=e.target.closest('.pbi');if(it)accept(+it.dataset.i)});
 m.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.w)return wrap('['+t.dataset.w+']','[/'+t.dataset.w+']');
  if(t.dataset.c)return wrap('[color='+t.dataset.c+']','[/color]');
  if(t.id==='pbAt'||t.id==='pbSl'){ta.focus();const c=ta.selectionStart,v=ta.value,ch=t.id==='pbAt'?'@':'/';const sp=c>0&&!/\s/.test(v[c-1])?' ':'';ta.value=v.slice(0,c)+sp+ch+v.slice(ta.selectionEnd);const q=c+sp.length+1;ta.setSelectionRange(q,q);sync();trigger();return}
  if(t.id==='pbClose')return pbClose();
  if(t.id==='pbGear'){const g=m.querySelector('#pbGearP');g.style.display=g.style.display==='block'?'none':'block';return}
  if(t.id==='pbCopyBB'){pbCopy(ta.value,'Copied BBCode');return}
  if(t.id==='pbCopyMD'){const r=pbToMD(ta.value);pbCopy(r.text,r.warn?'Copied for Discord. Colours were dropped, Discord has no colour tag.':'Copied for Discord');return}
  if(t.id==='pbHook'){pbSend(pbToMD(ta.value));return}
  if(t.id==='pbSaveTpl'){const n=(prompt('Name for this template')||'').trim();if(!n)return;C.postTpl=C.postTpl||[];const f=C.postTpl.find(x=>x.name===n);if(f)f.text=ta.value;else C.postTpl.push({name:n,text:ta.value});autosave();fillTpl();toast('Saved template "'+n+'"')}});
 tplSel.addEventListener('change',()=>{const v=tplSel.value;if(!v)return;const t=v[0]==='b'?PB_TPL[+v.slice(1)]:(C.postTpl||[])[+v.slice(1)];tplSel.value='';if(!t)return;PB.pick=null;const c=ta.selectionStart;const pre=ta.value&&c>0&&ta.value[c-1]!=='\n'?'\n':'';const x=pre+pbExpand(t.text);const v2=ta.value;ta.value=v2.slice(0,c)+x+v2.slice(ta.selectionEnd);const q=c+x.length;ta.focus();ta.setSelectionRange(q,q);sync()});
 m.querySelector('#pbRound').addEventListener('input',e=>{PB.round=e.target.value});
 [['pbBB','rollBB'],['pbMD','rollMD'],['pbUrl','sheetUrl'],['pbWeb','webhook']].forEach(([id,k])=>m.querySelector('#'+id).addEventListener('input',e=>{PBS[k]=e.target.value;if((k==='rollBB'||k==='rollMD')&&!e.target.value.includes('{d}'))PBS[k]=PB_DEF[k];pbSave();sync()}));
 m.addEventListener('mousedown',e=>{if(e.target===m)pbClose()});
 m.addEventListener('keydown',e=>{if(e.key==='Escape')pbClose()});
 sync();ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}
function pbClose(){const m=document.getElementById('pbMask');if(m)m.remove();PB.pick=null}
function pbCopy(t,msg){const done=()=>toast(msg);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>pbCopyOld(t,done))}else pbCopyOld(t,done)}
function pbCopyOld(t,done){const x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();try{document.execCommand('copy');done()}catch(e){toast('Could not copy. Select the text and copy it by hand.')}x.remove()}
function pbSend(r){
 if(!/^https:\/\/(discord(app)?\.com)\/api\/webhooks\//.test(PBS.webhook||'')){toast('Add a Discord webhook URL in the gear panel first');return}
 if(r.text.length>2000){toast('That is '+r.text.length+' characters. Discord allows 2000 per message.');return}
 fetch(PBS.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:r.text,username:C.name||'Character'})}).then(x=>toast(x.ok?'Posted to Discord'+(r.warn?' (colours dropped)':''):'Discord refused it: '+x.status),()=>toast('Could not reach Discord'))}
Object.assign(ACT,{postOpen:pbOpen});

/* =========================== INIT =========================== */
(function init(){
 $('#dlFeats').innerHTML=FEATNAMES.map(n=>`<option value="${esc(n)}">`).join('');$('#dlFeatNames').innerHTML=FEATURE_NAMES.map(n=>`<option value="${esc(n)}">`).join('');$('#dlClasses').innerHTML=Object.keys(CLASSLIB).map(n=>`<option value="${n}">`).join('');
 $('#dlSpells').innerHTML=SPLIST.map(s=>`<option value="${esc(s.n)}">${s.l}</option>`).join('');
 dbInit();
 try{const s=localStorage.getItem('grimoire-ledger-v3');if(s)C=normalize(JSON.parse(s))}catch(e){}
 render()})();

</script>
